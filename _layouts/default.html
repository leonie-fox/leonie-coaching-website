<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />
    <link rel="alternate" hreflang="de" href="{{ site.url }}{{ page.url }}" />
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="og:description" content="{{ page.description | default: site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <meta property="og:image" content="{{ site.url }}{{ page.og_image | default: site.default_image }}" />
    <meta property="og:image:alt" content="{{ page.og_image_alt | default: page.title }}" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.title }}" />
    <meta name="twitter:description" content="{{ page.description | default: site.description }}" />
    <meta name="twitter:image" content="{{ site.url }}{{ page.og_image | default: site.default_image }}" />
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "ProfessionalService",
            "name": "{{ site.title }}",
            "url": "{{ site.url }}",
            "image": "{{ site.url }}{{ site.default_image }}",
            "telephone": "{{ site.contact_phone }}",
            "email": "{{ site.contact_email }}",
            "description": "{{ site.description }}",
            "address": {
                "@type": "PostalAddress",
                "streetAddress": "{{ site.address_street }}",
                "addressLocality": "{{ site.address_locality }}",
                "postalCode": "{{ site.address_postal_code }}",
                "addressCountry": "{{ site.address_country }}"
            },
            "areaServed": ["Brühl", "Köln", "Online"],
            "knowsLanguage": ["de"]
        }
    </script>
    <script>
        (() => {
            try {
                const key = "lwc_first_load";
                if (!sessionStorage.getItem(key)) {
                    document.documentElement.classList.add("is-first-load");
                    sessionStorage.setItem(key, "1");
                }
            } catch (e) {
                /* no-op */
            }
        })();
    </script>
    <style>
        /* First-paint fallback to avoid white flash before CSS loads */
        :root {
            --color-bg: #f9f5f0;
            --color-text: #1f1f1f;
        }

        html,
        body {
            margin: 0;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        * {
            box-sizing: border-box;
        }
    </style>
    <link rel="preload" href="/assets/css/style.css" as="style" />
    <link rel="preload" href="/assets/img/logo.webp" as="image" />
    <link rel="preload" href="/assets/img/ivy-topleft.webp" as="image" />
    <link rel="preload" href="/assets/img/ivy-topright.webp" as="image" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script src="/assets/js/nav-prefetch.js" defer></script>
    <script src="/assets/js/nav-scroll.js" defer></script>
    <script type="speculationrules">
        {
            "prefetch": [
                {
                    "source": "document",
                    "where": { "selector_matches": ".main-nav a, .footer-nav a" },
                    "eagerness": "moderate"
                }
            ],
            "prerender": [
                {
                    "source": "document",
                    "where": { "selector_matches": ".main-nav a, .footer-nav a" },
                    "eagerness": "moderate"
                }
            ]
        }
    </script>
    {% if page.include_copy_js %}
    <script src="/assets/js/copy.js" defer></script>
    {% endif %}
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="shortcut icon" href="/favicon.ico">
</head>

<body class="site-body">
    <div class="ivy ivy-topleft"></div>
    <div class="ivy ivy-topright"></div>

    <!-- ================= HEADER ================= -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo-wrap" aria-label="Startseite">
                <span class="logo">
                    <img src="/assets/img/logo.webp" alt="Psychologisches Coaching – Leonie Wittkamp" />
                </span>
                <span class="logo-tagline">
                    Leonie Wittkamp<br>
                    <span>Psychologisches Coaching</span>
                </span>
            </a>

            <nav class="main-nav">
                <a href="/" class="nav-link{% if page.nav_active == 'home' %} is-active{% endif %}">Home</a>
                <a href="/systemisches-coaching"
                    class="nav-link{% if page.nav_active == 'coaching' %} is-active{% endif %}">Systemisches Coaching</a>
                <a href="/dein-coachingprozess"
                    class="nav-link{% if page.nav_active == 'prozess' %} is-active{% endif %}">Dein Coachingprozess</a>
                <a href="/ueber-mich" class="nav-link{% if page.nav_active == 'about' %} is-active{% endif %}">Über mich</a>
                <a href="/kontakt" class="nav-link{% if page.nav_active == 'kontakt' %} is-active{% endif %}">Kontakt</a>
            </nav>
        </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main>
        {{ content }}
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">
        <div class="container footer-inner">

            <nav class="footer-nav">
                <a href="/">Home</a>
                <a href="/systemisches-coaching">Systemisches Coaching</a>
                <a href="/dein-coachingprozess">Dein Coachingprozess</a>
                <a href="/ueber-mich">Über mich</a>
                <a href="/kontakt">Kontakt</a>
            </nav>

            <div class="footer-meta">
                <a href="/datenschutz">Datenschutz</a>
                <span>•</span>
                <a href="/impressum">Impressum</a>
            </div>

        </div>
    </footer>

</body>

</html>
